<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Basic Forms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">FormLab</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="index.html">Basic Forms</a>
        <a class="nav-link" href="bootstrap.html">Bootstrap Forms</a>
        <a class="nav-link" href="register.html">Registration</a>
      </div>
    </div>
  </div>
</nav>
<main class="container py-5">
  <div class="intro mb-4">
    <p class="eyebrow">Assignment #4</p>
    <h1>Basic HTML Forms</h1>
    <p class="text-secondary mb-0">A simple contact form with browser validation.</p>
  </div>
  <section class="form-card">
    <h2>Task 0 & 1: Contact us</h2>
    <p class="text-secondary">Fields marked with * are required.</p>
    <form action="#" method="get">
      <div class="mb-3">
        <label for="name" class="form-label">Name *</label>
        <input class="form-control" type="text" id="name" name="name" placeholder="Your name" required maxlength="50">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email *</label>
        <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" required maxlength="100">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message *</label>
        <textarea class="form-control" id="message" name="message" rows="4" placeholder="Write your message..." required maxlength="500"></textarea>
        <div class="form-text">Maximum 500 characters.</div>
      </div>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
  </section>
</main>
<footer class="text-center py-4">Assignment #4</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
